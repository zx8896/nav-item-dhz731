<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航站</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --shadow:0 4px 16px rgba(0,0,0,.07);
    --text:#1f2937; --dim:#6b7280; --accent:#4f46e5; --border:#e5e7eb; --hover:#f3f4f6;
  }
  body.dark{
    --bg:#0f172a; --card:#1e293b; --shadow:0 4px 18px rgba(0,0,0,.4);
    --text:#e5e7eb; --dim:#94a3b8; --accent:#818cf8; --border:#334155; --hover:#334155;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:.3s}
  a{text-decoration:none;color:inherit}

  /* ========== 顶部栏 ========== */
  .topbar{
    position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:10px 20px;background:color-mix(in srgb,var(--card) 88%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  /* 左上角天气 */
  .weather{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-width:200px}
  .weather .w-icon{font-size:30px;line-height:1}
  .weather .w-loc{font-size:13px;color:var(--dim)}
  .weather .w-temp{font-size:15px;font-weight:700}
  .weather .w-temp .w-desc{font-size:12px;font-weight:400;color:var(--dim)}
  .weather.loading{opacity:.5}
  /* 中间标题 */
  .brand{display:flex;align-items:center;gap:14px}
  .brand h1{font-size:22px;background:linear-gradient(90deg,var(--accent),#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand .btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
  .brand .btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .brand .admin-badge{font-size:12px;background:#ec4899;color:#fff;padding:3px 8px;border-radius:99px;animation:pulse 1.5s infinite}
  @keyframes pulse{50%{opacity:.6}}
  /* 右上角时钟 */
  .clock{text-align:right;min-width:230px;user-select:none}
  .clock .c-date{font-size:13px;color:var(--dim)}
  .clock .c-time{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .clock .c-cny{font-size:12px;color:#ec4899;font-weight:600;margin-top:2px}

  /* ========== 管理工具栏 ========== */
  .admin-bar{
    position:sticky;top:64px;z-index:99;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 20px;background:var(--accent);color:#fff;box-shadow:var(--shadow);
  }
  .admin-bar.hidden{display:none}
  .admin-bar button{background:rgba(255,255,255,.18);border:none;color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:.2s}
  .admin-bar button:hover{background:rgba(255,255,255,.32)}
  .admin-bar .hint{margin-left:auto;font-size:12px;opacity:.9}

  /* ========== 主区域 ========== */
  main{padding:24px 20px;max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;align-items:start}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;border:1px solid var(--border);transition:.25s}
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
  .card-head h2{font-size:16px}
  .card-head .cat-tools{display:flex;gap:6px;opacity:0;transition:.2s}
  .card:hover .cat-tools,.admin-mode .cat-tools{opacity:1}
  .mini-btn{border:none;background:var(--hover);color:var(--text);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;transition:.15s}
  .mini-btn:hover{background:var(--accent);color:#fff}
  .card-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;min-height:40px}
  /* 链接卡片 */
  .nav-item{
    display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:12px;
    background:var(--hover);border:1px solid transparent;cursor:pointer;transition:.18s;text-align:center;position:relative;
  }
  .nav-item:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
  .nav-item .item-icon{font-size:26px;line-height:1;height:30px;display:flex;align-items:center;justify-content:center}
  .nav-item .item-icon img{width:28px;height:28px;object-fit:contain}
  .nav-item .item-name{font-size:12.5px;color:var(--text);line-height:1.2;word-break:break-all}
  .nav-item .item-del{position:absolute;top:4px;right:4px;display:none;background:#ef4444;color:#fff;border:none;width:18px;height:18px;border-radius:50%;font-size:11px;cursor:pointer;line-height:1}
  .admin-mode .nav-item .item-del{display:block}
  /* 管理拖动样式 */
  .nav-item[draggable=true],.card[draggable=true]{cursor:grab}
  .dragging{opacity:.35}
  .drop-before{box-shadow:-4px 0 0 var(--accent)!important}
  .drop-after{box-shadow:4px 0 0 var(--accent)!important}
  .card.drop-before{box-shadow:0 -4px 0 var(--accent)!important}
  .card.drop-after{box-shadow:0 4px 0 var(--accent)!important}
  .card-body.drop-target{outline:2px dashed var(--accent);outline-offset:4px;border-radius:10px}

  footer{text-align:center;color:var(--dim);font-size:12px;padding:20px}

  /* ========== 弹窗 ========== */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(3px)}
  .modal-overlay.hidden{display:none}
  .modal{background:var(--card);border-radius:16px;padding:24px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.92);opacity:0}}
  .modal h3{margin-bottom:16px;font-size:18px}
  .modal label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
  .modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:.2s}
  .modal input:focus{border-color:var(--accent)}
  .modal .err{color:#ef4444;font-size:12px;margin-top:8px;display:block;min-height:16px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .btn{border:none;padding:9px 18px;border-radius:9px;cursor:pointer;font-size:14px;transition:.2s}
  .btn-cancel{background:var(--hover);color:var(--text)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{filter:brightness(1.1)}

  /* ========== Toast ========== */
  #toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;padding:10px 22px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:760px){
    .topbar{gap:8px;padding:10px 14px}
    .brand{order:1}.weather{order:2;min-width:0}.clock{order:3;min-width:0;width:100%;text-align:left}
    main{grid-template-columns:1fr;padding:16px 12px}
    .admin-bar{top:auto}
  }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="weather" id="weather" title="点击刷新天气">
    <span class="w-icon" id="wIcon">🌤️</span>
    <div>
      <div class="w-loc" id="wLoc">正在定位…</div>
      <div class="w-temp" id="wTemp">--°C <span class="w-desc"></span></div>
    </div>
  </div>

  <div class="brand">
    <h1>⭐ 我的导航站</h1>
    <button class="btn" id="adminBtn" onclick="toggleAdmin()">⚙️ 管理</button>
  </div>

  <div class="clock">
    <div class="c-date" id="cDate"></div>
    <div class="c-time" id="cTime">--:--:--</div>
    <div class="c-cny" id="cCny">🧧 春节倒计时…</div>
  </div>
</header>

<!-- 管理工具栏 -->
<div class="admin-bar hidden" id="adminBar">
  <button onclick="addCategory()">➕ 添加分类</button>
  <button onclick="openItemModal()">🔗 添加链接</button>
  <button onclick="exportData()">⬇️ 导出数据</button>
  <button onclick="importData()">⬆️ 导入数据</button>
  <button onclick="changePwd()">🔑 修改密码</button>
  <button onclick="resetData()">♻️ 重置默认</button>
  <button onclick="toggleAdmin()">✖️ 退出管理</button>
  <span class="hint">💡 拖动卡片可移动位置 / 拖到其它分类 / 拖分类卡片可排序，点击卡片可编辑</span>
</div>

<main id="main"></main>

<footer>📌 数据保存在本机浏览器 localStorage · 支持导出备份 · 天气数据来源 Open-Meteo</footer>

<!-- 弹窗 -->
<div class="modal-overlay hidden" id="overlay">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="modalConfirm()">确定</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".json" style="display:none" onchange="handleImport(event)">
<div id="toast"></div>

<script>
/* ================= 数据 ================= */
const LS_KEY = 'nav_dhz731_data';
const PWD_KEY = 'nav_dhz731_pwd';
const DEFAULT_DATA = {
  categories: [
    { id:'c1', title:'🔍 搜索引擎', items:[
      { id:'i1', name:'百度', url:'https://www.baidu.com', icon:'🔍' },
      { id:'i2', name:'谷歌', url:'https://www.google.com', icon:'🌐' },
      { id:'i3', name:'必应', url:'https://www.bing.com', icon:'🅱️' },
      { id:'i4', name:'知乎', url:'https://www.zhihu.com', icon:'💡' }
    ]},
    { id:'c2', title:'💻 开发工具', items:[
      { id:'i5', name:'GitHub', url:'https://github.com', icon:'🐙' },
      { id:'i6', name:'MDN', url:'https://developer.mozilla.org/zh-CN/', icon:'📘' },
      { id:'i7', name:'Stack Overflow', url:'https://stackoverflow.com', icon:'🧩' },
      { id:'i8', name:'Gitee', url:'https://gitee.com', icon:'🦘' }
    ]},
    { id:'c3', title:'🎬 视频娱乐', items:[
      { id:'i9', name:'哔哩哔哩', url:'https://www.bilibili.com', icon:'📺' },
      { id:'i10', name:'抖音', url:'https://www.douyin.com', icon:'🎵' },
      { id:'i11', name:'YouTube', url:'https://www.youtube.com', icon:'▶️' },
      { id:'i12', name:'微博', url:'https://weibo.com', icon:'📰' }
    ]},
    { id:'c4', title:'🛒 购物生活', items:[
      { id:'i13', name:'淘宝', url:'https://www.taobao.com', icon:'🛒' },
      { id:'i14', name:'京东', url:'https://www.jd.com', icon:'🐶' },
      { id:'i15', name:'美团', url:'https://www.meituan.com', icon:'🍔' },
      { id:'i16', name:'12306', url:'https://www.12306.cn', icon:'🚄' }
    ]}
  ]
};

let data = loadData();
let isAdmin = false;
let justDragged = false;
let dragItemId = null, dragCatId = null;
let modalCb = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getCat(id){ return data.categories.find(c=>c.id===id); }

function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.categories)) return d; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData(showToast=true){
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  if(showToast) toast('✅ 已保存');
}

/* ================= 渲染 ================= */
const main = document.getElementById('main');

function render(){
  main.innerHTML = '';
  data.categories.forEach(cat=>{
    const card = document.createElement('section');
    card.className = 'card';
    card.dataset.catId = cat.id;
    if(isAdmin) card.draggable = true;

    const head = document.createElement('div');
    head.className = 'card-head';
    const h2 = document.createElement('h2');
    h2.textContent = cat.title;
    head.appendChild(h2);

    if(isAdmin){
      const tools = document.createElement('div');
      tools.className = 'cat-tools';
      tools.innerHTML = `
        <button class="mini-btn" title="编辑分类" onclick="openCatModal('${cat.id}')">✏️</button>
        <button class="mini-btn" title="添加链接" onclick="openItemModal('${cat.id}')">➕</button>
        <button class="mini-btn" title="删除分类" onclick="delCategory('${cat.id}')">🗑️</button>`;
      head.appendChild(tools);
    }
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.dataset.catId = cat.id;

    cat.items.forEach(item=>{
      const a = document.createElement('a');
      a.className = 'nav-item';
      a.dataset.id = item.id;
      a.dataset.cat = cat.id;
      if(item.desc) a.title = item.desc;

      const icon = document.createElement('span');
      icon.className = 'item-icon';
      if(/^https?:\/\//i.test(item.icon||'')){
        const img = document.createElement('img');
        img.src = item.icon;
        img.alt = '';
        img.onerror = ()=>{ img.remove(); icon.textContent = '🔗'; };
        icon.appendChild(img);
      }else{
        icon.textContent = item.icon || '🔗';
      }
      const name = document.createElement('span');
      name.className = 'item-name';
      name.textContent = item.name;
      a.appendChild(icon); a.appendChild(name);

      if(isAdmin){
        a.draggable = true;
        a.href = 'javascript:void(0)';
        a.addEventListener('click', (e)=>{ e.preventDefault(); if(justDragged) return; openItemModal(cat.id, item.id); });
        const del = document.createElement('button');
        del.className = 'item-del';
        del.textContent = '×';
        del.title = '删除';
        del.addEventListener('click', (e)=>{ e.stopPropagation(); delItem(item.id); });
        a.appendChild(del);
      }else{
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener';
      }

      a.addEventListener('dragstart', handleDragStart);
      a.addEventListener('dragend', handleDragEnd);
      body.appendChild(a);
    });

    card.appendChild(body);
    main.appendChild(card);
  });
}

/* ================= 拖拽 ================= */
function handleDragStart(e){
  if(!isAdmin) return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain','x');
  if(e.target.classList.contains('nav-item')){
    dragItemId = e.target.dataset.id; dragCatId = null;
  }else if(e.target.classList.contains('card')){
    dragCatId = e.target.dataset.catId; dragItemId = null;
  }else return;
  requestAnimationFrame(()=>e.target.classList.add('dragging'));
}
function handleDragEnd(e){
  e.target.classList.remove('dragging');
  clearIndicators();
  dragItemId = null; dragCatId = null;
  justDragged = true;
  setTimeout(()=>justDragged=false, 80);
}
function clearIndicators(){
  document.querySelectorAll('.drop-before,.drop-after,.drop-target').forEach(el=>el.classList.remove('drop-before','drop-after','drop-target'));
}

main.addEventListener('dragover', e=>{
  if(!isAdmin) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearIndicators();
  if(dragItemId){
    const itemEl = e.target.closest('.nav-item');
    if(itemEl && itemEl.dataset.id !== dragItemId){
      const r = itemEl.getBoundingClientRect();
      itemEl.classList.add((e.clientX - r.left) > r.width/2 ? 'drop-after' : 'drop-before');
    }else{
      const bodyEl = e.target.closest('.card-body') || (e.target.closest('.card') && e.target.closest('.card').querySelector('.card-body'));
      if(bodyEl) bodyEl.classList.add('drop-target');
    }
  }else if(dragCatId){
    const cardEl = e.target.closest('.card');
    if(cardEl && cardEl.dataset.catId !== dragCatId){
      const r = cardEl.getBoundingClientRect();
      cardEl.classList.add((e.clientY - r.top) > r.height/2 ? 'drop-after' : 'drop-before');
    }
  }
});

main.addEventListener('drop', e=>{
  if(!isAdmin) return;
  e.preventDefault();
  clearIndicators();
  if(dragItemId){
    let targetCatId, insertIndex;
    const itemEl = e.target.closest('.nav-item');
    if(itemEl){
      const r = itemEl.getBoundingClientRect();
      const after = (e.clientX - r.left) > r.width/2;
      targetCatId = itemEl.dataset.cat;
      const items = getCat(targetCatId).items;
      insertIndex = items.findIndex(i=>i.id===itemEl.dataset.id);
      if(insertIndex === -1) insertIndex = items.length;
      else if(after) insertIndex++;
    }else{
      let bodyEl = e.target.closest('.card-body');
      if(!bodyEl){ const c = e.target.closest('.card'); if(c) bodyEl = c.querySelector('.card-body'); }
      if(!bodyEl) return;
      targetCatId = bodyEl.dataset.catId;
      insertIndex = getCat(targetCatId).items.length;
    }
    moveItem(dragItemId, targetCatId, insertIndex);
    dragItemId = null;
    render(); saveData();
  }else if(dragCatId){
    const cardEl = e.target.closest('.card');
    if(cardEl && cardEl.dataset.catId !== dragCatId){
      const r = cardEl.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height/2;
      const from = data.categories.findIndex(c=>c.id===dragCatId);
      let to = data.categories.findIndex(c=>c.id===cardEl.dataset.catId);
      if(after) to++;
      const [cat] = data.categories.splice(from,1);
      if(from < to) to--;
      data.categories.splice(Math.max(0,Math.min(to,data.categories.length)),0,cat);
      dragCatId = null;
      render(); saveData();
    }
  }
});

function moveItem(itemId, targetCatId, insertIndex){
  let sourceCatId=null, sourceIndex=-1, item=null;
  data.categories.forEach(cat=>{
    const i = cat.items.findIndex(it=>it.id===itemId);
    if(i>-1){ item = cat.items.splice(i,1)[0]; sourceCatId = cat.id; sourceIndex = i; }
  });
  if(!item) return;
  const target = getCat(targetCatId);
  if(!target) return;
  if(sourceCatId === targetCatId && sourceIndex < insertIndex) insertIndex--;
  insertIndex = Math.max(0, Math.min(insertIndex, target.items.length));
  target.items.splice(insertIndex, 0, item);
}

/* ================= 后台管理 ================= */
function toggleAdmin(){
  if(!isAdmin){
    if(sessionStorage.getItem('nav_admin_authed')==='1'){ setAdmin(true); return; }
    // 密码登录
    openModal('🔒 后台管理登录', `
      <label>请输入管理密码</label>
      <input type="password" id="f_pwd" placeholder="默认密码 admin123" onkeydown="if(event.key==='Enter')modalConfirm()">
      <span class="err" id="pwdErr"></span>`, ()=>{
      const pwd = document.getElementById('f_pwd').value;
      if(pwd === (localStorage.getItem(PWD_KEY) || 'admin123')){
        sessionStorage.setItem('nav_admin_authed','1');
        closeModal(); setAdmin(true); toast('🔓 已进入管理模式');
      }else{
        document.getElementById('pwdErr').textContent = '❌ 密码错误，请重试';
      }
    });
  }else{
    setAdmin(false);
  }
}
function setAdmin(v){
  isAdmin = v;
  document.body.classList.toggle('admin-mode', v);
  document.getElementById('adminBar').classList.toggle('hidden', !v);
  document.getElementById('adminBtn').textContent = v ? '✔️ 管理中' : '⚙️ 管理';
  render();
  if(!v) toast('已退出管理模式');
}
function changePwd(){
  openModal('🔑 修改管理密码', `
    <label>请输入新密码（留空则恢复默认 admin123）</label>
    <input type="password" id="f_newpwd" placeholder="新密码">`, ()=>{
    const v = document.getElementById('f_newpwd').value.trim();
    localStorage.setItem(PWD_KEY, v || 'admin123');
    closeModal(); toast('🔑 密码已更新');
  });
}

/* 分类操作 */
function addCategory(){ openCatModal(); }
function openCatModal(catId){
  const cat = catId ? getCat(catId) : null;
  openModal(cat ? '✏️ 编辑分类' : '➕ 添加分类', `
    <label>分类标题（可带 emoji）</label>
    <input id="f_title" placeholder="如：📚 学习资料" value="${cat ? cat.title.replace(/"/g,'&quot;') : ''}">`, ()=>{
    const title = document.getElementById('f_title').value.trim();
    if(!title){ alert('标题不能为空'); return; }
    if(cat){ cat.title = title; }
    else{ data.categories.push({ id:uid(), title, items:[] }); }
    closeModal(); render(); saveData();
  });
}
function delCategory(catId){
  if(!confirm('确定删除该分类及其所有链接吗？')) return;
  data.categories = data.categories.filter(c=>c.id!==catId);
  render(); saveData();
}

/* 链接操作 */
function openItemModal(catId, itemId){
  const cat = catId ? getCat(catId) : data.categories[0];
  const item = itemId ? cat.items.find(i=>i.id===itemId) : null;
  if(!cat){ alert('请先添加分类'); return; }
  openModal(item ? '✏️ 编辑链接' : '🔗 添加链接', `
    <label>链接名称 *</label>
    <input id="f_name" placeholder="如：百度" value="${item ? item.name.replace(/"/g,'&quot;') : ''}">
    <label>网址 URL *</label>
    <input id="f_url" placeholder="https://..." value="${item ? item.url.replace(/"/g,'&quot;') : ''}">
    <label>图标（emoji 或图片 URL，可留空）</label>
    <input id="f_icon" placeholder="🔗 或 https://xxx/icon.png" value="${item ? (item.icon||'').replace(/"/g,'&quot;') : ''}">
    <label>描述（选填，悬停显示）</label>
    <input id="f_desc" placeholder="一句话描述" value="${item ? (item.desc||'').replace(/"/g,'&quot;') : ''}">`, ()=>{
    const name = document.getElementById('f_name').value.trim();
    const url  = document.getElementById('f_url').value.trim();
    if(!name || !url){ alert('名称和网址不能为空'); return; }
    const icon = document.getElementById('f_icon').value.trim() || '🔗';
    const desc = document.getElementById('f_desc').value.trim();
    if(item){
      Object.assign(item, { name, url, icon, desc });
    }else{
      cat.items.push({ id:uid(), name, url, icon, desc });
    }
    closeModal(); render(); saveData();
  });
}
function delItem(itemId){
  data.categories.forEach(cat=>{ cat.items = cat.items.filter(i=>i.id!==itemId); });
  render(); saveData();
}

/* 导出 / 导入 / 重置 */
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nav-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('⬇️ 数据已导出');
}
function importData(){ document.getElementById('fileInput').click(); }
function handleImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const d = JSON.parse(ev.target.result);
      if(!d || !Array.isArray(d.categories)) throw new Error();
      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      data = d;
      saveData(); render();
      toast('⬆️ 导入成功');
    }catch(err){ alert('❌ 文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function resetData(){
  if(!confirm('确定恢复为默认数据吗？当前数据将被覆盖！')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  saveData(); render();
}

/* ================= 弹窗 ================= */
const overlay = document.getElementById('overlay');
function openModal(title, bodyHTML, cb){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  modalCb = cb;
  overlay.classList.remove('hidden');
  const inp = overlay.querySelector('input');
  if(inp) setTimeout(()=>inp.focus(), 50);
}
function closeModal(){ overlay.classList.add('hidden'); modalCb = null; }
function modalConfirm(){ if(modalCb) modalCb(); }
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

/* ================= Toast ================= */
const toastEl = document.getElementById('toast');
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 2200);
}

/* ================= 右上角：日期时间 + 春节倒计时 ================= */
// 已收录 2026~2035 年春节（正月初一）日期
const CNY_DATES = ['2026-02-17','2027-02-06','2028-01-26','2029-02-13','2030-02-03','2031-01-23','2032-02-11','2033-01-31','2034-02-19','2035-02-08'];

function tick(){
  const now = new Date();
  const weeks = ['日','一','二','三','四','五','六'];
  document.getElementById('cDate').textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${weeks[now.getDay()]}`;
  const p = n=>String(n).padStart(2,'0');
  document.getElementById('cTime').textContent = `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;

  // 春节倒计时
  const el = document.getElementById('cCny');
  let next = null;
  for(const d of CNY_DATES){
    const t = new Date(d + 'T00:00:00').getTime();
    if(t > now.getTime()){ next = {year:d.slice(0,4), time:t}; break; }
  }
  if(!next){ el.textContent = '🧧 春节日期未收录'; return; }
  const diff = next.time - now.getTime();
  if(diff <= 0){ el.textContent = '🧧 今天就是春节！恭喜发财 🎉'; return; }
  const days  = Math.floor(diff / 86400000);
  const hours = Math.floor(diff % 86400000 / 3600000);
  const mins  = Math.floor(diff % 3600000 / 60000);
  const secs  = Math.floor(diff % 60000 / 1000);
  el.textContent = `🧧 距${next.year}年春节 ${days}天 ${hours}时 ${mins}分 ${secs}秒`;
}
setInterval(tick, 1000);
tick();

/* ================= 左上角：IP 归属地 + 天气预报 ================= */
const WEATHER_MAP = {
  0:['☀️','晴'],1:['🌤️','晴间多云'],2:['⛅','多云'],3:['☁️','阴'],
  45:['🌫️','雾'],48:['🌫️','雾凇'],
  51:['🌦️','毛毛雨'],53:['🌦️','毛毛雨'],55:['🌧️','毛毛雨'],56:['🌧️','冻毛毛雨'],57:['🌧️','冻毛毛雨'],
  61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],66:['🌧️','冻雨'],67:['🌧️','冻雨'],
  71:['🌨️','小雪'],73:['🌨️','中雪'],75:['❄️','大雪'],77:['❄️','雪粒'],
  80:['🌦️','阵雨'],81:['🌧️','强阵雨'],82:['⛈️','暴雨'],
  85:['🌨️','阵雪'],86:['🌨️','强阵雪'],95:['⛈️','雷阵雨'],96:['⛈️','雷阵雨伴冰雹'],99:['⛈️','强雷暴']
};

async function getLocation(){
  const apis = [
    async()=>{ const r = await fetch('https://ipapi.co/json/'); const d = await r.json();
      return { city:d.city, region:d.region, lat:d.latitude, lon:d.longitude }; },
    async()=>{ const r = await fetch('https://api.ip.sb/geoip'); const d = await r.json();
      return { city:d.city, region:d.region, lat:d.latitude, lon:d.longitude }; },
    async()=>{ const r = await fetch('https://ipinfo.io/json'); const d = await r.json();
      const [lat,lon] = (d.loc||'39.9,116.4').split(',').map(Number);
      return { city:d.city, region:d.region, lat, lon }; }
  ];
  for(const api of apis){
    try{ const loc = await api();
      if(loc && loc.lat && loc.lon) return loc;
    }catch(e){}
  }
  return { city:'北京', region:'北京', lat:39.9042, lon:116.4074 };
}

async function loadWeather(){
  const w = document.getElementById('weather');
  w.classList.add('loading');
  try{
    const loc = await getLocation();
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m` +
      `&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
    const res = await fetch(url);
    if(!res.ok) throw new Error();
    const d = await res.json();
    const cur = d.current;
    const [icon, desc] = WEATHER_MAP[cur.weather_code] || ['🌡️','未知'];
    const max = d.daily.temperature_2m_max[0], min = d.daily.temperature_2m_min[0];
    document.getElementById('wIcon').textContent = icon;
    const city = loc.city || loc.region || '未知';
    document.getElementById('wLoc').textContent =
      (loc.region && loc.region !== city) ? `${city} · ${loc.region}` : city;
    document.getElementById('wTemp').innerHTML =
      `${Math.round(cur.temperature_2m)}°C <span class="w-desc">${desc} ${Math.round(min)}~${Math.round(max)}° 湿度${cur.relative_humidity_2m}%</span>`;
  }catch(err){
    document.getElementById('wLoc').textContent = '天气获取失败，点击重试';
    document.getElementById('wTemp').textContent = '--°C';
  }finally{
    w.classList.remove('loading');
  }
}
document.getElementById('weather').addEventListener('click', loadWeather);

/* ================= 启动 ================= */
render();
loadWeather();
</script>
